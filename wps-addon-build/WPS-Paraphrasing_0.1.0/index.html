function onAddinLoad(ribbonUI) {
  try {
    var app = window.Application;
    if (app && typeof app.ribbonUI !== 'object') app.ribbonUI = ribbonUI;
  } catch (e) {}
  return true;
}

function getProfiles() {
  try {
    var raw = localStorage.getItem('PARAPHRASE_PROFILES');
    var list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  } catch (e) { return []; }
}

function getActiveProfile() {
  try {
    var id = localStorage.getItem('PARAPHRASE_ACTIVE_PROFILE') || '';
    var list = getProfiles();
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) return list[i]; }
    return list.length === 1 ? list[0] : null;
  } catch (e) { return null; }
}

function getSelection() {
  var app = window.Application;
  try { return app.ActiveDocument.Application.Selection; } catch (e1) {}
  try { return app.Selection; } catch (e2) {}
  return null;
}

function onGetContextMenuVisible() {
  return true;
}

function onGetSeparatorVisible() { return true; }
function onGetImage() { return ''; }
function onShowPane() {
  try {
    var app = window.Application;
    if (app && app.ShowDialog) {
      app.ShowDialog(location.origin + '/taskpane.html', 'Settings', 480, 840, false);
    }
  } catch (e) {}
}

function onContextMenuParaphrase() {
  try {
    var app = window.Application;
    if (!app || !app.ShowDialog) {
      return;
    }
    var w = 480;
    var h = 840;
    try {
      w = Math.round(480 * window.devicePixelRatio);
      h = Math.round(840 * window.devicePixelRatio);
    } catch (e0) {}
    app.ShowDialog(location.origin + '/dialog.html', 'Paraphrase', w, h, false);
  } catch (e) {
    // silent
  }
}

window.OnAddinLoad = onAddinLoad;
window.OnShowPane = onShowPane;
window.OnGetImage = onGetImage;
window.OnGetContextMenuVisible = onGetContextMenuVisible;
window.OnGetSeparatorVisible = onGetSeparatorVisible;
window.OnContextMenuParaphrase = onContextMenuParaphrase;
</script>
